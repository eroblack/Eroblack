<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Multi-User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 350px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #075e54;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        #error { color: red; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-box">
    <h3>Antre Enfòmasyon yo</h3>
    <input type="tel" id="phone" placeholder="Nimewo telefòn">
    <input type="password" id="password" placeholder="Modpas">
    <button onclick="checkLogin()">Konekte</button>
    <p id="error"></p>
</div>

<script>
    // Isit la ou ka ajoute kantite nimewo ou vle
    // "NIMÈWO" : "MODPAS"
    const database = {
        "12345678": "3579",
        "87654321": "D468",
        "11223344": "5566",
        "50944445555": "pass123"
    };

    function checkLogin() {
        const phoneInput = document.getElementById('phone').value.trim();
        const passInput = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('error');

        // Tcheke si nimewo a egziste nan database la
        if (database.hasOwnProperty(phoneInput)) {
            
            // Si nimewo a la, tcheke si modpas la koresponn
            if (database[phoneInput] === passInput) {
                errorMsg.style.color = "green";
                errorMsg.innerHTML = "OK! Remplissage en cours...";
                
                // Voye nimewo a nan EdittextA nan Sketchware
                if (window.Android) {
                    window.Android.voyeNimewo(phoneInput);
                }
            } else {
                errorMsg.style.color = "red";
                errorMsg.innerHTML = "Modpas la pa kòrèk pou nimewo sa!";
            }
        } else {
            errorMsg.style.color = "red";
            errorMsg.innerHTML = "Nimewo sa pa anrejistre nan sistèm nan!";
        }
    }
</script>

</body>
</html>
