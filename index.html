<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Extreme Challenge</title>
    <style>
        body { margin: 0; background: #050510; color: white; font-family: 'Arial', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; pointer-events: none; }
        .stat { font-size: 22px; font-weight: bold; text-shadow: 2px 2px #000; margin: 5px; }
        #difficulty { color: #ffcc00; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">Pwen: <span id="score">0</span></div>
        <div class="stat" id="difficulty">Nivo: 10 HP</div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const diffEl = document.getElementById("difficulty");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let gameActive = true;
let startTime = Date.now();
let enemyMaxHP = 10; 

const player = { x: canvas.width / 2 - 25, y: canvas.height - 80, w: 50, h: 50 };
const bullets = [];
const enemies = [];

// Kontwòl
window.addEventListener("touchmove", (e) => { player.x = e.touches[0].clientX - player.w / 2; });
window.addEventListener("mousemove", (e) => { player.x = e.clientX - player.w / 2; });

function updateDifficulty() {
    if (!gameActive) return;
    let timePassed = Math.floor((Date.now() - startTime) / 1000);
    
    // Ogmante chak 60 segonn
    let newHP = 10 + (Math.floor(timePassed / 60) * 10);
    
    // LIMIT MAKISMOM LAN SE 100
    if (newHP > 100) newHP = 100;

    if (newHP !== enemyMaxHP) {
        enemyMaxHP = newHP;
        diffEl.innerText = "Nivo: " + enemyMaxHP + " HP";
    }
}

function getPoints(hp) {
    // KALKIL PWEN YO DAPRE SA W MANDE A
    if (hp >= 100) return 60;
    if (hp >= 90) return 50;
    if (hp >= 80) return 40;
    if (hp >= 70) return 30;
    if (hp >= 60) return 20;
    if (hp >= 50) return 5;
    return 1; // Si l anba 50
}

function spawnEnemy() {
    if (!gameActive) return;
    enemies.push({
        x: Math.random() * (canvas.width - 60),
        y: -60, w: 60, h: 60,
        hp: enemyMaxHP,
        speed: 2
    });
}
setInterval(spawnEnemy, 1200);

function shoot() {
    if (gameActive) bullets.push({ x: player.x + player.w/2 - 3, y: player.y, w: 6, h: 18, speed: 15 });
}
setInterval(shoot, 100); 

function update() {
    if (!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    updateDifficulty();

    // Player
    ctx.fillStyle = "red";
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // Bal
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        ctx.fillStyle = "#00FF00";
        ctx.fillRect(bullets[i].x, bullets[i].y, bullets[i].w, bullets[i].h);
        if (bullets[i].y < 0) bullets.splice(i, 1);
    }

    // Lènmi
    for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        en.y += en.speed;
        
        ctx.fillStyle = "#444";
        ctx.fillRect(en.x, en.y, en.w, en.h);
        ctx.strokeStyle = "white";
        ctx.strokeRect(en.x, en.y, en.w, en.h);
        
        ctx.fillStyle = "white";
        ctx.fillText(en.hp, en.x + 30, en.y + 35);

        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (b.x < en.x + en.w && b.x + b.w > en.x && b.y < en.y + en.h && b.y + b.h > en.y) {
                en.hp -= 1;
                bullets.splice(j, 1);
                if (en.hp <= 0) {
                    score += getPoints(enemyMaxHP); // Pran pwen yo isit la
                    scoreEl.innerText = score;
                    enemies.splice(i, 1);
                }
                break;
            }
        }

        if (en && player.x < en.x + en.w && player.x + player.w > en.x && player.y < en.y + en.h && player.y + player.h > en.y) {
            gameActive = false;
            alert("Game Over! Pwen: " + score);
            location.reload();
        }
    }
    requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
