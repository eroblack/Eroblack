<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Air Strike</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; background: linear-gradient(to right, #000428, #004e92); }
        #ui { position: absolute; top: 10px; left: 10px; font-size: 20px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">Pwen: <span id="score">0</span> | Lavi: <span id="lives">3</span></div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let lives = 3;
let gameActive = true;

const player = { x: 50, y: canvas.height / 2, w: 40, h: 30, speed: 7 };
const bullets = [];
const enemies = [];
const particles = [];
let boss = null;

// Kontwòl Tactile pou Mobile
window.addEventListener("mousemove", (e) => { player.y = e.clientY; player.x = e.clientX; });
window.addEventListener("touchmove", (e) => {
    player.y = e.touches[0].clientY;
    player.x = e.touches[0].clientX;
});

function spawnEnemy() {
    if (!boss) {
        enemies.push({
            x: canvas.width,
            y: Math.random() * (canvas.height - 30),
            w: 30, h: 30, speed: 3 + (score / 100)
        });
    }
}
setInterval(spawnEnemy, 1000);

function shoot() {
    if (gameActive) bullets.push({ x: player.x + player.w, y: player.y, w: 10, h: 4, speed: 10 });
}
setInterval(shoot, 250);

function update() {
    if (!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Desine Player (Avyon)
    ctx.fillStyle = "#00FF00";
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - 15);
    ctx.lineTo(player.x + 40, player.y);
    ctx.lineTo(player.x, player.y + 15);
    ctx.fill();

    // Jere Bal
    bullets.forEach((b, bi) => {
        b.x += b.speed;
        ctx.fillStyle = "yellow";
        ctx.fillRect(b.x, b.y, b.w, b.h);
        if (b.x > canvas.width) bullets.splice(bi, 1);
    });

    // Jere Lènmi
    enemies.forEach((en, ei) => {
        en.x -= en.speed;
        ctx.fillStyle = "red";
        ctx.fillRect(en.x, en.y, en.w, en.h);

        // Kolizyon Bal ak Lènmi
        bullets.forEach((b, bi) => {
            if (b.x < en.x + en.w && b.x + b.w > en.x && b.y < en.y + en.h && b.y + b.h > en.y) {
                enemies.splice(ei, 1);
                bullets.splice(bi, 1);
                score += 10;
                scoreEl.innerText = score;
                if (score % 200 === 0 && score > 0) spawnBoss();
            }
        });

        // Kolizyon Lènmi ak Player
        if (player.x < en.x + en.w && player.x + 30 > en.x && player.y - 15 < en.y + en.h && player.y + 15 > en.y) {
            enemies.splice(ei, 1);
            lives--;
            livesEl.innerText = lives;
            if (lives <= 0) gameOver();
        }
        if (en.x < 0) enemies.splice(ei, 1);
    });

    // Sistèm Boss
    if (boss) {
        ctx.fillStyle = "purple";
        ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
        boss.y += boss.dy;
        if (boss.y <= 0 || boss.y + boss.h >= canvas.height) boss.dy *= -1;

        bullets.forEach((b, bi) => {
            if (b.x < boss.x + boss.w && b.x + b.w > boss.x && b.y < boss.y + boss.h && b.y + b.h > boss.y) {
                boss.hp--;
                bullets.splice(bi, 1);
                if (boss.hp <= 0) {
                    score += 100;
                    scoreEl.innerText = score;
                    boss = null;
                }
            }
        });
    }

    requestAnimationFrame(update);
}

function spawnBoss() {
    boss = { x: canvas.width - 100, y: 50, w: 80, h: 80, hp: 50, dy: 3 };
}

function gameOver() {
    gameActive = false;
    alert("Game Over! Pwen ou se: " + score);
    location.reload();
}

update();
</script>
</body>
</html>
