<!DOCTYPE html>
<html lang="kmw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Runner</title>
    <style>
        * { padding: 0; margin: 0; overflow: hidden; }
        body { 
            background-color: #f0f0f0; 
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameCanvas {
            background-color: #fff;
            border-bottom: 2px solid #333;
            display: block;
        }
        .score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="score">Pwen: <span id="scoreVal">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("scoreVal");

        // Ajiste gwosè ekran an
        canvas.width = window.innerWidth;
        canvas.height = 300;

        let score = 0;
        let gameSpeed = 5;
        let isGameOver = false;

        // Karaktè a
        const player = {
            x: 50,
            y: canvas.height - 50,
            width: 40,
            height: 40,
            color: "#FF0000",
            dy: 0,
            jumpForce: 12,
            gravity: 0.6,
            grounded: false
        };

        // Obstak yo
        const obstacles = [];
        function spawnObstacle() {
            let size = Math.random() * (50 - 20) + 20;
            obstacles.push({
                x: canvas.width,
                y: canvas.height - size,
                width: size,
                height: size,
                color: "#333"
            });
        }

        // Kontwòl sote (Touch oswa Klik)
        window.addEventListener("mousedown", jump);
        window.addEventListener("touchstart", (e) => {
            e.preventDefault();
            jump();
        });

        function jump() {
            if (player.grounded && !isGameOver) {
                player.dy = -player.jumpForce;
                player.grounded = false;
            } else if (isGameOver) {
                resetGame();
            }
        }

        function resetGame() {
            score = 0;
            obstacles.length = 0;
            gameSpeed = 5;
            isGameOver = false;
            requestAnimationFrame(update);
        }

        function update() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gravite ak Mouvman
            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
                player.dy = 0;
                player.grounded = true;
            }

            // Desine Karaktè a
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Jere Obstak
            if (Math.random() < 0.01) spawnObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                o.x -= gameSpeed;

                ctx.fillStyle = o.color;
                ctx.fillRect(o.x, o.y, o.width, o.height);

                // Detekte Kolizyon
                if (
                    player.x < o.x + o.width &&
                    player.x + player.width > o.x &&
                    player.y < o.y + o.height &&
                    player.y + player.height > o.y
                ) {
                    isGameOver = true;
                    alert("Game Over! Pwen ou se: " + Math.floor(score));
                }

                if (o.x + o.width < 0) {
                    obstacles.splice(i, 1);
                    score += 1;
                    gameSpeed += 0.1; // Ogmante difikilte dousman
                }
            }

            scoreElement.innerText = Math.floor(score);
            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
