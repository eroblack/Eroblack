<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Edition</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; z-index: 2; position: relative; }
        
        /* Background repete Eroblack */
        #bg-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-wrap: wrap; justify-content: space-around;
            align-content: space-around; opacity: 0.07; pointer-events: none; z-index: 1;
        }
        .bg-item { font-size: 14px; font-weight: bold; letter-spacing: 2px; }

        #ui { position: absolute; top: 15px; width: 100%; text-align: center; z-index: 10; pointer-events: none; }
        .stat { font-size: 18px; font-weight: 900; text-transform: uppercase; margin: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        #difficulty { color: #00d4ff; font-size: 14px; }
    </style>
</head>
<body>
    <div id="bg-pattern"></div>
    <div id="ui">
        <div class="stat">SCORE: <span id="score">0</span></div>
        <div id="difficulty" class="stat">LVL: 10 | PTS: 1</div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
// Kreye background repete a dinamikman
const bgPattern = document.getElementById("bg-pattern");
for (let i = 0; i < 150; i++) {
    const span = document.createElement("span");
    span.className = "bg-item";
    span.innerText = "EROBLACK";
    bgPattern.appendChild(span);
}

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const diffEl = document.getElementById("difficulty");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let gameActive = true;
let startTime = Date.now();
let enemyMaxHP = 10;
let pointsPerEnemy = 1;

const player = {
    x: canvas.width / 2 - 25,
    y: canvas.height - 150, // Remonte avyon an pi wo
    w: 50,
    h: 50,
    color: "#ff0033"
};

const bullets = [];
const enemies = [];

window.addEventListener("touchmove", (e) => { 
    player.x = e.touches[0].clientX - player.w / 2; 
    player.y = e.touches[0].clientY - player.h / 2; // Pèmèt bouje l monte desann tou
});
window.addEventListener("mousemove", (e) => { 
    player.x = e.clientX - player.w / 2; 
    player.y = e.clientY - player.h / 2;
});

function updateDifficulty() {
    let timePassed = Math.floor((Date.now() - startTime) / 1000);
    let newHP = 10 + (Math.floor(timePassed / 30) * 10);
    if (newHP > 100) newHP = 100;
    
    if (newHP !== enemyMaxHP) {
        enemyMaxHP = newHP;
        pointsPerEnemy = enemyMaxHP >= 50 ? Math.floor(enemyMaxHP / 10) : 1;
        diffEl.innerText = `LVL: ${enemyMaxHP} | PTS: ${pointsPerEnemy}`;
    }
}

function spawnEnemy() {
    if (!gameActive) return;
    const size = 55;
    enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        w: size,
        h: size,
        hp: enemyMaxHP,
        speed: 2 + (Math.random() * 1.5)
    });
}
setInterval(spawnEnemy, 1200);

function shoot() {
    if (gameActive) {
        bullets.push({ x: player.x + player.w / 2 - 3, y: player.y, w: 6, h: 20, speed: 15 });
    }
}
setInterval(shoot, 150);

function update() {
    if (!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    updateDifficulty();

    // Desine Avyon Eroblack
    ctx.fillStyle = player.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff0033";
    ctx.beginPath();
    ctx.moveTo(player.x + player.w / 2, player.y);
    ctx.lineTo(player.x, player.y + player.h);
    ctx.lineTo(player.x + player.w, player.y + player.h);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Bal
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y -= b.speed;
        ctx.fillStyle = "#00ffcc";
        ctx.fillRect(b.x, b.y, b.w, b.h);
        if (b.y < 0) bullets.splice(i, 1);
    }

    // Lènmi (Kare)
    for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        en.y += en.speed;
        
        // Chanje koulè si li rive 50+
        ctx.fillStyle = en.hp >= 50 ? "#ffcc00" : "#333";
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.strokeRect(en.x, en.y, en.w, en.h);
        ctx.fillRect(en.x, en.y, en.w, en.h);
        
        // Tèks HP (Pi gwo si HP a wo)
        ctx.fillStyle = "white";
        let fontSize = en.hp >= 50 ? "24px" : "18px";
        ctx.font = `bold ${fontSize} Arial`;
        ctx.textAlign = "center";
        ctx.fillText(en.hp, en.x + en.w/2, en.y + en.h/2 + 8);

        // Check Hit
        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (b.x < en.x + en.w && b.x + b.w > en.x && b.y < en.y + en.h && b.y + b.h > en.y) {
                en.hp -= 1;
                bullets.splice(j, 1);
                if (en.hp <= 0) {
                    enemies.splice(i, 1);
                    score += pointsPerEnemy;
                    scoreEl.innerText = score;
                }
                break;
            }
        }

        if (en && player.x < en.x + en.w && player.x + player.w > en.x && player.y < en.y + en.h && player.y + player.h > en.y) {
            gameActive = false;
            alert("GAME OVER\nScore final: " + score);
            location.reload();
        }
        if (en.y > canvas.height) enemies.splice(i, 1);
    }
    requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
