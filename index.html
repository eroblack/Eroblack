<!DOCTYPE html>
<html lang="hat">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 300px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #764ba2; }
        button {
            width: 100%;
            padding: 12px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover { background: #5a3a7e; }
        #message { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Koneksyon</h2>
    <input type="tel" id="phone" placeholder="Nimewo Telefòn (eg: 12345678)">
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="valideLogin()">Konekte</button>
    <p id="message"></p>
</div>

<script>
    function valideLogin() {
        const phone = document.getElementById('phone').value;
        const pass = document.getElementById('password').value;
        const msg = document.getElementById('message');

        // Isit la ou ka chanje "1234" pou modpas ou vle a
        const modpasKorek = "1234";

        if (pass === modpasKorek) {
            msg.style.color = "green";
            msg.innerHTML = "Aksè Otoriize!";
            
            // Si w nan Sketchware, liy sa ap voye nimewo a nan Edittext la
            if(window.Android) {
                window.Android.voyeNimewo(phone);
            }
        } else {
            msg.style.color = "red";
            msg.innerHTML = "Mot de passe kòwonpi!";
        }
    }
</script>

</body>
</html>
