<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Score Evolution</title>
    <style>
        body { margin: 0; background: #050510; color: white; font-family: 'Arial', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; pointer-events: none; }
        .stat { font-size: 22px; font-weight: bold; text-shadow: 2px 2px #000; margin: 5px; }
        #difficulty { color: #00ffff; }
        #score-val { color: #00ff00; font-size: 30px; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">Pwen: <span id="score-val">0</span></div>
        <div class="stat" id="difficulty">Lavi Lènmi: 10 bal (+1 pt)</div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score-val");
const diffEl = document.getElementById("difficulty");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let gameActive = true;
let startTime = Date.now();
let enemyMaxHP = 10; 

const player = {
    x: canvas.width / 2 - 25,
    y: canvas.height - 100,
    w: 50,
    h: 50,
    color: "#FF0000"
};

const bullets = [];
const enemies = [];

// Kontwòl
window.addEventListener("touchmove", (e) => { player.x = e.touches[0].clientX - player.w / 2; });
window.addEventListener("mousemove", (e) => { player.x = e.clientX - player.w / 2; });

function updateDifficulty() {
    if (!gameActive) return;
    let timePassed = Math.floor((Date.now() - startTime) / 1000); 
    
    // Ogmante HP pa 10 chak 60 segonn
    let newHP = 10 + (Math.floor(timePassed / 60) * 10);
    
    if (newHP !== enemyMaxHP) {
        enemyMaxHP = newHP;
        
        // Kalkile valè pwen an pou afiche l
        let pointValue = 1;
        if (enemyMaxHP >= 50) {
            pointValue = Math.floor(enemyMaxHP / 50) * 5;
        }
        diffEl.innerText = `Lavi Lènmi: ${enemyMaxHP} bal (+${pointValue} pts)`;
    }
}

function spawnEnemy() {
    if (!gameActive) return;
    const size = 60;
    enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        w: size,
        h: size,
        hp: enemyMaxHP,
        maxHpRef: enemyMaxHP, // Nou garde sa pou konnen konbe pwen pou n bay
        speed: 1.8
    });
}
setInterval(spawnEnemy, 1500);

function shoot() {
    if (gameActive) {
        bullets.push({ x: player.x + player.w / 2 - 3, y: player.y, w: 6, h: 20, speed: 15 });
    }
}
setInterval(shoot, 130);

function update() {
    if (!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    updateDifficulty();

    // Avyon
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // Bal
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y -= b.speed;
        ctx.fillStyle = "#ffff00";
        ctx.fillRect(b.x, b.y, b.w, b.h);
        if (b.y < 0) bullets.splice(i, 1);
    }

    // Lènmi
    for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        en.y += en.speed;
        
        ctx.fillStyle = "#333";
        ctx.strokeStyle = en.maxHpRef >= 50 ? "#00ff00" : "white";
        ctx.lineWidth = 3;
        ctx.strokeRect(en.x, en.y, en.w, en.h);
        ctx.fillRect(en.x, en.y, en.w, en.h);
        
        ctx.fillStyle = "white";
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.fillText(en.hp, en.x + en.w/2, en.y + en.h/2 + 5);

        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (b.x < en.x + en.w && b.x + b.w > en.x && b.y < en.y + en.h && b.y + b.h > en.y) {
                en.hp -= 1;
                bullets.splice(j, 1);
                
                if (en.hp <= 0) {
                    // SISTÈM PWEN YO:
                    let pointsToAdd = 1;
                    if (en.maxHpRef >= 50) {
                        // Si se 50 li bay 5, si se 100 li bay 10...
                        pointsToAdd = Math.floor(en.maxHpRef / 50) * 5;
                    }
                    
                    score += pointsToAdd;
                    scoreEl.innerText = score;
                    enemies.splice(i, 1);
                }
                break;
            }
        }

        if (en && player.x < en.x + en.w && player.x + player.w > en.x && player.y < en.y + en.h && player.y + player.h > en.y) {
            gameOver();
        }
        if (en.y > canvas.height) enemies.splice(i, 1);
    }
    requestAnimationFrame(update);
}

function gameOver() {
    gameActive = false;
    alert("Game Over!\nPwen final: " + score);
    location.reload();
}

update();
</script>
</body>
</html>
