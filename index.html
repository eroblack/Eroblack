<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Sky Defender</title>
    <style>
        body { margin: 0; background: #010b1a; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; font-size: 22px; font-weight: bold; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">Pwen: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let gameActive = true;

// Avyon an (li anba nèt)
const player = {
    x: canvas.width / 2 - 25,
    y: canvas.height - 80,
    w: 50,
    h: 50,
    color: "#FF0000" // Avyon Wouj
};

const bullets = [];
const enemies = [];

// Kontwòl ak dwèt (Mobile) oswa Mouse (PC)
window.addEventListener("touchmove", (e) => {
    let touchX = e.touches[0].clientX;
    player.x = touchX - player.w / 2;
});
window.addEventListener("mousemove", (e) => {
    player.x = e.clientX - player.w / 2;
});

// Fonksyon pou kreye lènmi k ap sot anlè
function spawnEnemy() {
    if (!gameActive) return;
    const size = 40;
    enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        w: size,
        h: size,
        speed: 3 + (score / 100)
    });
}
setInterval(spawnEnemy, 800); // Yon lènmi chak 0.8 segonn

// Fonksyon pou tire anlè otomatikman
function shoot() {
    if (gameActive) {
        bullets.push({ 
            x: player.x + player.w / 2 - 2, 
            y: player.y, 
            w: 5, 
            h: 15, 
            speed: 8 
        });
    }
}
setInterval(shoot, 300); // Yon bal chak 0.3 segonn

function update() {
    if (!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Desine Avyon Wouj la (triyang)
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.moveTo(player.x + player.w / 2, player.y);
    ctx.lineTo(player.x, player.y + player.h);
    ctx.lineTo(player.x + player.w, player.y + player.h);
    ctx.closePath();
    ctx.fill();

    // 2. Jere Bal yo (monte anlè)
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y -= b.speed;
        ctx.fillStyle = "#FFFF00"; // Bal jòn
        ctx.fillRect(b.x, b.y, b.w, b.h);

        if (b.y < 0) bullets.splice(i, 1);
    }

    // 3. Jere Lènmi yo (desann anba)
    for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        en.y += en.speed;
        ctx.fillStyle = "#555"; // Koulè obstak yo
        ctx.fillRect(en.x, en.y, en.w, en.h);

        // Detekte si bal frape lènmi
        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (b.x < en.x + en.w && b.x + b.w > en.x && b.y < en.y + en.h && b.y + b.h > en.y) {
                enemies.splice(i, 1);
                bullets.splice(j, 1);
                score += 10;
                scoreEl.innerText = score;
                break;
            }
        }

        // Detekte si lènmi frape avyon an
        if (en && player.x < en.x + en.w && player.x + player.w > en.x && player.y < en.y + en.h && player.y + player.h > en.y) {
            gameOver();
        }

        // Retire lènmi ki depase ekran an
        if (en.y > canvas.height) enemies.splice(i, 1);
    }

    requestAnimationFrame(update);
}

function gameOver() {
    gameActive = false;
    alert("Ou pèdi! Pwen ou se: " + score);
    location.reload(); // Rekòmanse jwèt la
}

update();
</script>
</body>
</html>
