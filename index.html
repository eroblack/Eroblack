<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Bridge Game</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; z-index: 2; position: relative; }
        #bg-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-wrap: wrap; justify-content: space-around;
            align-content: space-around; opacity: 0.05; pointer-events: none; z-index: 1;
        }
        .bg-item { font-size: 10px; font-weight: bold; letter-spacing: 1px; }
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; z-index: 10; pointer-events: none; }
        .stat { font-size: 18px; font-weight: 900; text-transform: uppercase; margin: 2px; }
    </style>
</head>
<body>
    <div id="bg-pattern"></div>
    <div id="ui">
        <div class="stat">SCORE: <span id="score">0</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
// --- FONKSYON POU PALE AK APLIKASYON AN ---
function sendToApp(key, value) {
    // Si w ap itilize Sketchware (WebView Asset)
    if (window.Zandron) {
        window.Zandron.showData(key, value);
    }
    // Si se yon lòt sistèm, sa ap parèt nan console la tou
    console.log("Sent to App -> " + key + ": " + value);
}

const bgPattern = document.getElementById("bg-pattern");
for (let i = 0; i < 100; i++) {
    const span = document.createElement("span");
    span.className = "bg-item";
    span.innerText = "EROBLACK";
    bgPattern.appendChild(span);
}

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let gameActive = true;
let startTime = Date.now();
let enemyMaxHP = 10;
let pointsPerEnemy = 1;

const player = {
    x: canvas.width / 2 - 25,
    y: canvas.height - 160,
    w: 50,
    h: 50,
    color: "#ff0033"
};

const bullets = [];
const enemies = [];

const moveHandler = (e) => {
    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let clientY = e.touches ? e.touches[0].clientY : e.clientY;
    player.x = clientX - player.w / 2;
    player.y = clientY - player.h / 2;
};
window.addEventListener("touchmove", moveHandler);
window.addEventListener("mousemove", moveHandler);

function updateDifficulty() {
    let timePassed = Math.floor((Date.now() - startTime) / 1000);
    let newHP = 10 + (Math.floor(timePassed / 25) * 10);
    if (newHP > 100) newHP = 100;
    
    if (newHP !== enemyMaxHP) {
        enemyMaxHP = newHP;
        if (enemyMaxHP < 50) pointsPerEnemy = 1;
        else if (enemyMaxHP === 50) pointsPerEnemy = 10;
        else if (enemyMaxHP === 60) pointsPerEnemy = 20;
        else if (enemyMaxHP === 70) pointsPerEnemy = 30;
        else if (enemyMaxHP === 80) pointsPerEnemy = 40;
        else if (enemyMaxHP === 90) pointsPerEnemy = 50;
        else if (enemyMaxHP === 100) pointsPerEnemy = 60;
    }
}

function spawnEnemy() {
    if (!gameActive) return;
    const size = 55;
    enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size, w: size, h: size,
        hp: enemyMaxHP,
        speed: 0.8 + (Math.random() * 0.7) // Desann dousman
    });
}
setInterval(spawnEnemy, 1400);

function shoot() {
    if (gameActive) {
        bullets.push({ x: player.x + player.w / 2 - 3, y: player.y, w: 6, h: 20, speed: 12 });
    }
}
setInterval(shoot, 160);

function update() {
    if (!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    updateDifficulty();

    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.moveTo(player.x + player.w / 2, player.y);
    ctx.lineTo(player.x, player.y + player.h);
    ctx.lineTo(player.x + player.w, player.y + player.h);
    ctx.fill();

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y -= b.speed;
        ctx.fillStyle = "#00ffcc";
        ctx.fillRect(b.x, b.y, b.w, b.h);
        if (b.y < 0) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        en.y += en.speed;
        
        ctx.fillStyle = en.hp >= 50 ? "#ffcc00" : "#222";
        ctx.strokeStyle = "#fff";
        ctx.strokeRect(en.x, en.y, en.w, en.h);
        ctx.fillRect(en.x, en.y, en.w, en.h);
        
        ctx.fillStyle = "white";
        ctx.font = en.hp >= 50 ? "bold 24px Arial" : "bold 18px Arial";
        ctx.textAlign = "center";
        ctx.fillText(en.hp, en.x + en.w/2, en.y + en.h/2 + 8);

        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (b.x < en.x + en.w && b.x + b.w > en.x && b.y < en.y + en.h && b.y + b.h > en.y) {
                en.hp -= 1;
                bullets.splice(j, 1);
                if (en.hp <= 0) {
                    enemies.splice(i, 1);
                    score += pointsPerEnemy;
                    scoreEl.innerText = score;
                    
                    // VOYE SCORE A BAY APLIKASYON AN (edittextScore)
                    sendToApp("edittextScore", score.toString());
                }
                break;
            }
        }

        if (en && player.x < en.x + en.w && player.x + player.w > en.x && player.y < en.y + en.h && player.y + player.h > en.y) {
            gameOver();
        }
        if (en.y > canvas.height) enemies.splice(i, 1);
    }
    requestAnimationFrame(update);
}

function gameOver() {
    gameActive = false;
    
    // VOYE MO "fini" AN BAY APLIKASYON AN (edittextFini)
    sendToApp("edittextFini", "fini");
    
    alert("FINI! \nScore: " + score);
    location.reload();
}

update();
</script>
</body>
</html>
