<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Heavy Strike</title>
    <style>
        body { margin: 0; background: #020205; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; font-size: 24px; font-weight: bold; pointer-events: none; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>
    <div id="ui">Pwen: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let gameActive = true;

const player = {
    x: canvas.width / 2 - 25,
    y: canvas.height - 80,
    w: 50,
    h: 50,
    color: "#FF0000"
};

const bullets = [];
const enemies = [];

window.addEventListener("touchmove", (e) => { player.x = e.touches[0].clientX - player.w / 2; });
window.addEventListener("mousemove", (e) => { player.x = e.clientX - player.w / 2; });

function spawnEnemy() {
    if (!gameActive) return;
    const size = 50;
    enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        w: size,
        h: size,
        hp: 10, // Li bezwen 10 kout bal pou l mouri
        speed: 2
    });
}
setInterval(spawnEnemy, 1200);

function shoot() {
    if (gameActive) {
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 6, h: 15, speed: 10 });
    }
}
setInterval(shoot, 150); // Li tire vit pou ka bay 10 kout yo fasil

function update() {
    if (!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Desine Avyon Wouj
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.moveTo(player.x + player.w / 2, player.y);
    ctx.lineTo(player.x, player.y + player.h);
    ctx.lineTo(player.x + player.w, player.y + player.h);
    ctx.fill();

    // Jere Bal
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y -= b.speed;
        ctx.fillStyle = "#00FFFF"; 
        ctx.fillRect(b.x, b.y, b.w, b.h);
        if (b.y < 0) bullets.splice(i, 1);
    }

    // Jere Obstak yo
    for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        en.y += en.speed;
        
        // Koulè a chanje selon kantite HP ki rete (li vin pi blan lè l ap mouri)
        let colorValue = 255 - (en.hp * 20);
        ctx.fillStyle = `rgb(100, ${colorValue}, ${colorValue})`;
        ctx.fillRect(en.x, en.y, en.w, en.h);
        
        // Montre kantite kou ki rete sou obstak la
        ctx.fillStyle = "white";
        ctx.font = "12px Arial";
        ctx.fillText(en.hp, en.x + 20, en.y + 30);

        // Kolizyon Bal ak Obstak
        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (b.x < en.x + en.w && b.x + b.w > en.x && b.y < en.y + en.h && b.y + b.h > en.y) {
                en.hp -= 1; // Retire 1 nan 10 lavi yo
                bullets.splice(j, 1);
                
                if (en.hp <= 0) {
                    enemies.splice(i, 1);
                    score += 1; // Bay 1 sèl pwen
                    scoreEl.innerText = score;
                }
                break;
            }
        }

        // Kolizyon ak Avyon an
        if (en && player.x < en.x + en.w && player.x + player.w > en.x && player.y < en.y + en.h && player.y + player.h > en.y) {
            gameOver();
        }

        if (en.y > canvas.height) enemies.splice(i, 1);
    }

    requestAnimationFrame(update);
}

function gameOver() {
    gameActive = false;
    alert("Jwèt Fini! Pwen: " + score);
    location.reload();
}

update();
</script>
</body>
</html>
